name: Contrôles

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifications:
    name: Types, style, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Style
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      # Le navigateur du système n'existe pas sur le runner : on installe Chromium.
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout
        # Sans API, les parcours qui en dépendent sont ignorés : le reste tourne.
        run: npm run test:e2e

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
